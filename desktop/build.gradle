// Desktop (LWJGL3) module.
// Upstream beatoraja uses libGDX 1.9.9 with LWJGL 2, which has never supported arm64 macOS
// and never will. The core here is already on libGDX 1.14, so only a desktop backend was
// missing.
plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'com.starxh.beatoraja.desktop.DesktopLauncher'
}

sourceSets.main.java.srcDirs = ['src/main/java']

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    // natives-desktop already ships macOS arm64 in 1.14
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:$gdxControllersVersion"
    // BGA: VideoPlayerCreator looks up com.badlogic.gdx.video.VideoPlayerDesktop by name on
    // desktop. That class comes from the official gdx-video-lwjgl3; the vendored
    // gdx-video-core here is the same 1.3.4, so the interfaces match.
    implementation "com.badlogicgames.gdx-video:gdx-video-lwjgl3:$gdxVideoVersion"
    implementation 'org.xerial:sqlite-jdbc:3.50.1.0'
    // the JDBC accessor maps ResultSets with commons-dbutils (core depends on it too)
    implementation 'commons-dbutils:commons-dbutils:1.8.1'
}

// GLFW requires the first thread of the process on macOS. The lwjgl3 backend in libGDX
// 1.14 does not ship StartOnFirstThreadHelper, so the flag has to be passed explicitly.
// Note this deadlocks the upstream JavaFX config window; this module is pure LWJGL3.
def macJvmArgs = org.gradle.internal.os.OperatingSystem.current().isMacOsX()
        ? ['-XstartOnFirstThread'] : []

// Rhythm games are very sensitive to GC pauses: a single G1 collection right after loading
// a thousand keysounds drops frames. ZGC is a concurrent collector with sub-millisecond
// pauses. Size the heap up front so it never has to grow mid-play.
def gameJvmArgs = macJvmArgs + ['-Xms2g', '-Xmx4g', '-XX:+UseZGC']

def orajaHome = System.getProperty('user.home') + '/Games/beatoraja0.8.8-modernchic'

// the application plugin already creates a run task; configure it instead of adding one
tasks.named('run', JavaExec) {
    jvmArgs = gameJvmArgs
    // run inside an existing beatoraja install so config.json / skin / songdata.db resolve
    workingDir = file(orajaHome)
    systemProperty 'beatoraja.root', orajaHome
    standardInput = System.in
}

tasks.register('scanSongs', JavaExec) {
    group = 'application'
    description = 'Rebuild songdata.db from the configured BMS roots, without starting the game'
    mainClass = 'com.starxh.beatoraja.desktop.ScanTool'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = file(orajaHome)
    systemProperty 'beatoraja.root', orajaHome
}

tasks.register('audioBench', JavaExec) {
    group = 'verification'
    description = 'Measure ogg decode time and voice rejection under native arm64'
    mainClass = 'com.starxh.beatoraja.desktop.AudioBenchmark'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = macJvmArgs
    systemProperty 'oraja.songdir', project.findProperty('oraja.songdir') ?: ''
}

// Build a macOS .app with an embedded JRE via jpackage - double-click to run, no system Java.
tasks.register('packageApp', Exec) {
    group = 'distribution'
    description = 'Package a native macOS .app'
    dependsOn 'installDist'

    def outDir = layout.buildDirectory.dir('jpackage').get().asFile
    def input = layout.buildDirectory.dir('install/desktop/lib').get().asFile
    def icon = file('packaging/beatoraja.icns')

    doFirst {
        outDir.deleteDir()
        outDir.mkdirs()
        // The main jar carries a version (desktop-<version>.jar) so it cannot be hardcoded;
        // --main-jar is relative to the input directory
        def mainJar = input.listFiles().find { it.name.startsWith('desktop-') && it.name.endsWith('.jar') }
        if (mainJar == null) throw new GradleException("no desktop-*.jar under ${input}")
        args = args.collect { it == '@MAIN_JAR@' ? mainJar.name : it }
    }

    commandLine 'jpackage',
            '--type', 'app-image',
            '--name', 'beatoraja',
            '--app-version', '1.0.0',  // macOS rejects a leading zero; upstream version goes in vendor
            '--vendor', 'beatoraja 0.8.8 — Apple Silicon port',
            '--icon', icon.absolutePath,
            '--input', input.absolutePath,
            '--main-jar', '@MAIN_JAR@',
            '--main-class', 'com.starxh.beatoraja.desktop.DesktopLauncher',
            '--dest', outDir.absolutePath,
            // The default runtime image has bin/java stripped, but this bundle calls java
            // itself (see packaging/launcher.sh), so keep a full JDK.
            '--runtime-image', System.getProperty('java.home'),
            // Baked in because Finder starts the app without a shell to pass them
            '--java-options', '-XstartOnFirstThread',
            '--java-options', '-Xms2g',
            '--java-options', '-Xmx4g',
            '--java-options', '-XX:+UseZGC',
            '--mac-package-identifier', 'dev.wheatfox.beatoraja'

    // jpackage cannot set a working directory and Finder starts apps with CWD=/, while
    // libGDX caches the real CWD when Gdx.files loads, so changing user.dir afterwards does
    // not help and relative font and skin paths all miss. See packaging/launcher.sh.
    doLast {
        // Use our own script as the bundle entry point rather than renaming the jpackage
        // launcher; it calls the bundled JRE. Reasons in packaging/launcher.sh.
        def macos = new File(outDir, 'beatoraja.app/Contents/MacOS')
        copy {
            from file('packaging/launcher.sh')
            into macos
            rename { 'beatoraja' }
        }
        new File(macos, 'beatoraja').setExecutable(true)
    }
}
